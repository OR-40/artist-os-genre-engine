name: ARTIST DNA prototype tests

on:
  pull_request:
    branches:
      - feat/fireredvad-vocal-detection
  push:
    branches:
      - feat/artist-dna-orchestrator

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-api.txt
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-api.txt numpy scipy
      - name: Run unit and API contract tests
        run: python -m unittest discover -s tests -v
